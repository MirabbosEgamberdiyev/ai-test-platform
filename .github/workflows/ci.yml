name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Quality Gate (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & ArchUnit Architecture Rules
        working-directory: backend
        run: mvn test-compile -B

      - name: Run Unit Tests & ArchUnit Suite
        working-directory: backend
        run: mvn test -B

      - name: Run Integration Tests (Testcontainers)
        working-directory: backend
        run: mvn verify -DskipUnitTests=true -B

      - name: Generate JaCoCo Code Coverage Report
        working-directory: backend
        run: mvn jacoco:report

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/**/target/site/jacoco/

  frontend-check:
    name: Frontend Quality Gate (Next.js / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint & TypeCheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build

  container-security-scan:
    name: Container Security & Vulnerability Scan
    needs: [ backend-test, frontend-check ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t ai-test-platform-backend:latest -f backend/Dockerfile backend

      - name: Scan Image with Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-test-platform-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
