version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_test_platform
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: PlatformSecurePass123!
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d ai_test_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no", "--requirepass", "RedisSecurePass123!", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisSecurePass123!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai_platform_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: platform_mq
      RABBITMQ_DEFAULT_PASS: RabbitSecurePass123!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: ai_platform_otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    networks:
      - platform_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai_platform_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - platform_net

  loki:
    image: grafana/loki:2.9.4
    container_name: ai_platform_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - platform_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai_platform_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:
